[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "template_project_name"
version = "0.0.2"
description = "about project"
authors = [
    { name = "stpatrirach" }
]
requires-python = ">=3.10"
dependencies = [
    "click >= 8.3.1",
    "other_lib>=3.1.5",
    "another_lib>=80.9.0"
]

[tool.setuptools]
packages = [
"scripts_dir",
"scripts_dir.modules_dir",
"scripts_dir.tools_dir",
"scripts_dir.ect_available_dirs",
]


package-dir = {"" = "src"}

[project.scripts]
name = 'name.main:main'
