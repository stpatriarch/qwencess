[project]
name = "qwencess"
version = "0.0.1dev20260902"
description = "Simple CLI interface for Qwen3-0.6B local model."
readme = "README.md"
license = { file = "LICENSE" }

authors = [
    { name = "stpatrirach", email = "chinaryannarek@gmail.com"}
]

requires-python = ">=3.10"

dependencies = [
    "accelerate>=1.14.0",
    "click>=8.3.1",
    "flask>=3.1.3",
    "requests>=2.28.1",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[project.scripts]
qwen = 'qwencess.cli:main'

[project.urls]
Homepage = "https://github.com/stpatriarch/qwencess"
Repository = "https://github.com/stpatriarch/qwencess"
